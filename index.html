<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));
const CFG_KEY='rotayks_supabase_config_v1', DEMO_KEY='rotayks_demo_payload_v1';
const NAV=[['dashboard','⌂','Genel Bakış'],['calendar','▦','Takvim'],['tasks','☑','Görevler'],['progress','↗','İlerlemem'],['exams','▥','Denemeler'],['timer','◷','Kronometre'],['books','▤','Kaynaklarım'],['topics','◎','Konu Takibi'],['routines','↻','Günlük Rutinler'],['notes','✎','Notlarım'],['ai-coach','✦','Yapay Zekâ Koçu'],['settings','⚙','Ayarlar']];

const EXAMS=['TYT','AYT'];const DAY_NAMES=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];const DAY_SHORT=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
let view='dashboard',db=emptyData(),demoMode=false,authUser=null,supabaseClient=null,weekOffset=0,expandedCalendarDate='',taskFilter='all',topicExamFilter='all',topicSubjectFilter='all',toastTimer=null,saveTimer=null,localMode=false,authTab='login';
function emptyData(){return {books:[],tasks:[],topics:[],routines:[],routineChecks:{},notes:[],exams:[],timer:{elapsedMs:0,runningSince:null,subject:'Matematik',sessions:[]},meta:{createdAt:new Date().toISOString()}}}
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d,opts={day:'numeric',month:'short'}){return new Intl.DateTimeFormat('tr-TR',opts).format(d)}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fromISO(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12)}
function startWeek(base=new Date(),offset=0){const d=new Date(base.getFullYear(),base.getMonth(),base.getDate(),12);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+offset*7);return d}
function addDays(d,n){const out=new Date(d);out.setDate(out.getDate()+n);return out}
function weekDates(offset=0){const s=startWeek(new Date(),offset);return Array.from({length:7},(_,i)=>addDays(s,i))}
function weekLabel(offset=0){const ds=weekDates(offset);return `${fmtDate(ds[0],{day:'numeric',month:'long'})} – ${fmtDate(ds[6],{day:'numeric',month:'long',year:'numeric'})}`}
function escAttr(x){return esc(x).replace(/`/g,'&#96;')}
function bookById(id){return db.books.find(b=>b.id===id)}
function unitById(book,id){return book?.units?.find(u=>u.id===id)}
function totalTests(book){return (book.units||[]).reduce((n,u)=>n+(Number(u.testCount)||0),0)}
function completedTestKeys(bookId,unitId){const set=new Set();db.tasks.filter(t=>t.completed&&t.bookId===bookId&&t.unitId===unitId&&Number(t.testStart)>0&&Number(t.testEnd)>=Number(t.testStart)).forEach(t=>{for(let i=Number(t.testStart);i<=Number(t.testEnd);i++)set.add(i)});return set}
function bookStats(book){let total=0,done=0;for(const u of (book.units||[])){total+=Number(u.testCount)||0;done+=completedTestKeys(book.id,u.id).size}return {total,done,pct:total?Math.min(100,Math.round(done/total*100)):0}}
function tasksForDate(date){const d=iso(date);return db.tasks.filter(t=>t.date===d).sort((a,b)=>(a.completed?1:0)-(b.completed?1:0))}
function subjectColor(subject){const colors={Matematik:'blue',Geometri:'orange',Fizik:'red',Kimya:'orange',Biyoloji:'teal',Türkçe:'violet',Tarih:'orange',Coğrafya:'teal'};return colors[subject]||'blue'}
function safeData(v){if(!v||typeof v!=='object')return emptyData();const e=emptyData();return {...e,...v,books:Array.isArray(v.books)?v.books:[],tasks:Array.isArray(v.tasks)?v.tasks:[],topics:Array.isArray(v.topics)?v.topics:[],routines:Array.isArray(v.routines)?v.routines:[],routineChecks:v.routineChecks&&typeof v.routineChecks==='object'?v.routineChecks:{},notes:Array.isArray(v.notes)?v.notes:[],exams:Array.isArray(v.exams)?v.exams:[],timer:v.timer&&typeof v.timer==='object'?{elapsedMs:Number(v.timer.elapsedMs)||0,runningSince:v.timer.runningSince||null,subject:v.timer.subject||'Matematik',sessions:Array.isArray(v.timer.sessions)?v.timer.sessions:[]}:e.timer}}
function getYksDate(){const raw=db.meta&&db.meta.yksDate;return /^\d{4}-\d{2}-\d{2}$/.test(String(raw||''))?raw:'2027-06-19'}
function activityDates(){const set=new Set();for(const t of db.tasks||[]){if(!t.completed)continue;const date=String(t.completedAt||t.date||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(date))set.add(date)}for(const [key,value] of Object.entries(db.routineChecks||{})){if(value){const date=key.split('_')[0];if(/^\d{4}-\d{2}-\d{2}$/.test(date))set.add(date)}}for(const session of db.timer?.sessions||[]){if(session.date)set.add(String(session.date).slice(0,10))}return set}
function studyStreak(){const dates=activityDates(),today=iso(new Date()),yesterday=iso(addDays(new Date(),-1));let cursor=dates.has(today)?today:dates.has(yesterday)?yesterday:'';if(!cursor)return 0;let count=0;while(dates.has(cursor)&&count<5000){count++;cursor=iso(addDays(fromISO(cursor),-1))}return count}
function renderYksMiniStats(){const root=$('#yksMiniStats');if(!root)return;const target=getYksDate(),today=iso(new Date()),diff=Math.ceil((fromISO(target)-fromISO(today))/86400000),count=diff>=0?diff:0;const streak=studyStreak();root.innerHTML=`<div class="yks-mini-card"><button data-action="set-yks-date" title="YKS tarihini ayarla"><strong>${count}</strong><span>YKS'ye kalan gün ⚙</span></button></div><div class="yks-mini-card" title="Tamamlanan görev, rutin veya kronometre oturumu olan ardışık günler"><strong>🔥 ${streak}</strong><span>Günlük seri</span></div>`}
function showToast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toastRoot').innerHTML='',3000)}

function coachInsights(){
 const today=iso(new Date()),dates=weekDates(0),weekKeys=new Set(dates.map(iso));
 const sessions=(db.timer?.sessions||[]).filter(x=>Number(x.ms)>0&&x.date);
 const todaySessions=sessions.filter(x=>String(x.date).slice(0,10)===today);
 const weekSessions=sessions.filter(x=>weekKeys.has(String(x.date).slice(0,10)));
 const todayMs=todaySessions.reduce((n,x)=>n+(Number(x.ms)||0),0),weekMs=weekSessions.reduce((n,x)=>n+(Number(x.ms)||0),0);
 const todayTasks=tasksForDate(new Date()),openToday=todayTasks.filter(t=>!t.completed),weekTasks=dates.flatMap(d=>tasksForDate(d)),weekDone=weekTasks.filter(t=>t.completed).length;
 const weekPct=weekTasks.length?Math.round(weekDone/weekTasks.length*100):0;
 const sortedExams=[...(db.exams||[])].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 const last=sortedExams[0],prev=sortedExams[1],delta=(last&&prev)?Number((Number(last.totalNet||0)-Number(prev.totalNet||0)).toFixed(2)):null;
 const books=[...(db.books||[])].map(b=>({b,s:bookStats(b)})).filter(x=>x.s.total>0&&x.s.pct<100).sort((a,b)=>a.s.pct-b.s.pct);
 const doneTasks=db.tasks.filter(t=>t.completed),pendingAll=db.tasks.filter(t=>!t.completed);
 const suggestions=[];
 // Today's actionable priority, grounded in actual schedule.
 if(openToday.length){const first=[...openToday].sort((a,b)=>(Number(b.priority||0)-Number(a.priority||0))||(Number(a.duration||45)-Number(b.duration||45)))[0];suggestions.push({icon:'🎯',tone:'warn',title:`Bugün ${openToday.length} görev bekliyor`,text:`İlk adım: “${first.title}”. Yaklaşık ${Number(first.duration)||45} dakika ayırıp tek oturumda bitirmeyi hedefle. Görev süresi belirtilmemişse bu süre yalnızca planlama varsayımıdır.`,action:'calendar'});}
 else if(!todayTasks.length){suggestions.push({icon:'🗓️',tone:'',title:'Bugün için ölçülebilir plan oluştur',text:'Takvime 1 ana görev ve 1 kısa tekrar ekle. Her göreve ders, kaynak/konu ve tahmini süre yaz; gün sonunda planlananla gerçekleşeni karşılaştır.',action:'calendar'});}
 else suggestions.push({icon:'✅',tone:'good',title:'Bugünün planı tamamlandı',text:'Bugünkü görevler tamamlanmış. İstersen 10–15 dakikalık yanlış tekrarı yap veya yarının ilk görevini hazırla.',action:'calendar'});
 // Compare actual study time against a conservative 2-hour daily target only as a configurable reference, not a claim.
 const targetMs=2*3600000,remaining=Math.max(0,targetMs-todayMs);
 if(todayMs===0)suggestions.push({icon:'⏱️',tone:'warn',title:'Bugün henüz çalışma kaydı yok',text:'Çalışmaya başladığında kronometreyi aç veya bitirdiğin süreyi elle kaydet. Kayıt olmadan günlük ve haftalık analizler eksik kalır.',action:'timer'});
 else if(remaining>0)suggestions.push({icon:'📈',tone:'',title:'Günlük çalışma hedefi için kalan süre',text:`Bugün ${Math.floor(todayMs/3600000)} saat ${Math.floor(todayMs%3600000/60000)} dakika kayıtlı. Örnek 2 saatlik referans hedefe ${Math.floor(remaining/3600000)} saat ${Math.floor(remaining%3600000/60000)} dakika kalıyor. Hedefi kendi programına göre ayarlayabilirsin.`,action:'timer'});
 else suggestions.push({icon:'⚡',tone:'good',title:'Referans çalışma süresine ulaştın',text:'Bugün en az 2 saat kayıtlı çalışman var. Daha fazla süreyi zorlamak yerine verimli bir kapanış ve kısa tekrar yapmayı değerlendirebilirsin.',action:'timer'});
 // Subject analysis based on multiple recent exams where possible.
 const recent=sortedExams.slice(0,3),bySubject={};
 recent.forEach(ex=>(ex.subjects||[]).forEach(s=>{const n=(Number(s.correct)||0)+(Number(s.wrong)||0)+(Number(s.blank)||0);if(!n)return;const k=s.subject||'Diğer';(bySubject[k]||(bySubject[k]=[])).push({net:Number(s.net)||0,n,exam:ex.name,date:ex.date});}));
 const subjectRows=Object.entries(bySubject).map(([subject,arr])=>({subject,avg:arr.reduce((n,x)=>n+x.net,0)/arr.length,count:arr.length,last:arr[0],prev:arr[1]})).sort((a,b)=>a.avg-b.avg);
 if(subjectRows.length){const weak=subjectRows[0];suggestions.push({icon:'🧠',tone:'warn',title:`Öncelikli inceleme: ${weak.subject}`,text:`Son ${weak.count} kayıtlı denemede bu dersin ortalama neti ${weak.avg.toFixed(2)}. Bu tek başına kesin konu eksiği değildir; yanlış/boş sorularını konu bazında incele ve en sık tekrarlanan 1–2 başlığa çalışma görevi ekle.`,action:'exams'});}
 if(delta!==null){suggestions.push({icon:delta>0?'📈':delta<0?'🔎':'📊',tone:delta>0?'good':delta<0?'warn':'',title:`Son denemede net değişimi: ${delta>0?'+':''}${delta}`,text:delta>0?'Son kayıtta toplam netin önceki kayıttan yüksek. Hangi derslerin katkı sağladığını branş detaylarında kontrol et.':delta<0?'Toplam net önceki kayda göre düşmüş. Sonuçtan tek başına hüküm çıkarma; sınav zorluğu, süre yönetimi ve ders bazlı yanlışları karşılaştır.':'Toplam net değişmemiş. Branş bazındaki artış ve düşüşleri inceleyerek bir sonraki çalışma önceliğini belirle.',action:'exams'});}
 else if(sortedExams.length===1)suggestions.push({icon:'📊',tone:'',title:'İlk deneme kaydı hazır',text:'İkinci denemeyi de kaydettiğinde toplam net değişimini karşılaştırabiliriz. Mümkünse sınav türü ve koşulları benzer denemeleri karşılaştır.',action:'exams'});
 // Source-specific actionable plan.
 if(books.length){const x=books[0],remainingTests=Math.max(0,x.s.total-x.s.done);suggestions.push({icon:'📚',tone:'',title:`Kaynak hedefi: ${x.b.name}`,text:`Kaydedilmiş ilerleme %${x.s.pct}; kalan ${remainingTests} test. Bu kaynağı küçük bloklara bölerek takvime dağıt. Test sayısı veya tamamlanma işaretleri eksikse önce kitap verisini doğrula.`,action:'books'});}
 if(weekTasks.length){suggestions.push({icon:'🗓️',tone:weekPct>=75?'good':'',title:`Haftalık plan gerçekleşmesi: %${weekPct}`,text:`${weekDone}/${weekTasks.length} görev tamamlandı. ${weekPct<50?'Kalan görevleri önem sırasına göre seç; hepsini aynı güne yığma.':weekPct<80?'Ertelenen görevlerden en önemlilerini gelecek haftaya bilinçli biçimde taşı.':'Planın büyük bölümü tamamlanmış; gelecek hafta için sürdürülebilir bir yük belirle.'}`,action:'calendar'});}
 if(!db.exams.length)suggestions.push({icon:'📝',tone:'',title:'Analizleri kişiselleştirmek için deneme ekle',text:'TYT/AYT denemelerini branş bazında kaydet. Yeterli veri birikince net eğilimi ve ders öncelikleri daha anlamlı hesaplanır.',action:'exams'});
 if(!db.books.length)suggestions.push({icon:'📖',tone:'',title:'Kaynaklarını sisteme tanımla',text:'Kitap, ünite ve test sayılarını ekle. Böylece koç paneli tamamlanan testleri ve kalan kaynak iş yükünü izleyebilir.',action:'books'});
 const safeSuggestions=suggestions.slice(0,6);
 const fmt=ms=>`${Math.floor(ms/3600000)}s ${Math.floor(ms%3600000/60000)}dk`;
 const studyBySubject=Object.entries(weekSessions.reduce((o,x)=>{const k=x.subject||'Genel';o[k]=(o[k]||0)+(Number(x.ms)||0);return o;},{})).sort((a,b)=>b[1]-a[1]);
 const focusLine=studyBySubject.length?`Bu hafta en çok kayıtlı süre: ${studyBySubject[0][0]} (${fmt(studyBySubject[0][1])}).`:'Ders bazlı süre önerileri için çalışma oturumlarını ders seçerek kaydet.';
 return `<div class="coach-grid"><section class="coach-card"><div class="coach-card-head"><h2>✦ Akıllı koç ve çalışma önerileri</h2><span class="tag violet">Kayıt verisine dayalı</span></div><div class="coach-card-body"><div class="coach-insights-list">${safeSuggestions.map(x=>`<article class="coach-insight"><div class="coach-icon ${x.tone}">${x.icon}</div><div class="coach-insight-copy"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p><button class="coach-link" data-nav="${x.action}">İlgili bölümü aç →</button></div></article>`).join('')}</div><div class="coach-action"><button class="secondary" data-nav="calendar">Haftalık planı aç →</button><button class="ghost" data-nav="exams">Deneme analizleri →</button></div><p class="coach-note">Öneriler kaydedilmiş verilerden üretilen kurallı analizlerdir; profesyonel koç veya öğretmen değerlendirmesinin yerine geçmez. Yeterli veri yoksa bu açıkça belirtilir.</p></div></section><section class="coach-card"><div class="coach-card-head"><h2>📈 Çalışma performansı</h2><span class="tag teal">Bu hafta</span></div><div class="coach-card-body"><div class="coach-metrics"><div class="coach-metric"><span>Bugün kaydedilen süre</span><strong>${fmt(todayMs)}</strong><small>${todaySessions.length} çalışma kaydı</small></div><div class="coach-metric"><span>Haftalık kayıtlı süre</span><strong>${fmt(weekMs)}</strong><small>${weekSessions.length} çalışma kaydı</small></div><div class="coach-metric"><span>Görev tamamlama</span><strong>%${weekPct}</strong><small>${weekDone}/${weekTasks.length} görev</small><div class="coach-meter"><span style="width:${weekPct}%"></span></div></div><div class="coach-metric"><span>Son deneme net değişimi</span><strong>${delta===null?'—':`${delta>0?'+':''}${delta}`}</strong><small>${delta===null?'Karşılaştırma için en az 2 deneme': 'Son iki kayıtlı deneme'}</small></div></div><p class="coach-note">${esc(focusLine)} Hesaplamalar yalnızca kaydedilen oturumları ve denemeleri içerir; kayıt dışı çalışma tahmin edilmez.</p></div></section></div>`;
}
function renderDashboard(){const all=db.tasks.length,done=db.tasks.filter(t=>t.completed).length,books=db.books.length,topics=db.topics.length,topicsDone=db.topics.filter(t=>t.completed).length;const today=new Date();const todays=tasksForDate(today);const dates=weekDates(0);const weekTasks=dates.flatMap(d=>tasksForDate(d));const weekDone=weekTasks.filter(t=>t.completed).length;const bookArr=db.books.slice(0,5);return `${pageHead('Planın net, hedefin yakın.','Bugün ne yapacağını bil; ilerlemeni adım adım gör.',`<button class="secondary" data-action="open-routine">＋ Rutin ekle</button><button class="primary" data-action="open-task" data-date="${iso(today)}">＋ Görev ekle</button>`)}

function renderTaskRow(t){const book=bookById(t.bookId),unit=unitById(book,t.unitId);const detail=[t.subject,t.exam,t.topicName, t.teacher?`Öğretmen: ${t.teacher}`:'',book?book.name:'',unit?.name||'',t.testStart?`Test ${t.testStart}${t.testEnd&&t.testEnd!==t.testStart?`–${t.testEnd}`:''}`:''].filter(Boolean).join(' · ');return `<div class="task-row ${t.completed?'completed':''}"><button class="check ${t.completed?'checked':''}" data-action="toggle-task" data-id="${t.id}" aria-label="Görevi tamamla">${t.completed?'✓':''}</button><div class="task-content"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${esc(detail||t.type||'Çalışma görevi')}${t.duration?` · ${t.duration} dk`:''}${t.videoUrl?`<br><a href="${esc(t.videoUrl)}" target="_blank" rel="noopener noreferrer">Ders videosunu aç ↗</a>`:''}${t.notes?`<br>${esc(t.notes)}`:''}</div></div><span class="tag ${t.completed?'teal':subjectColor(t.subject)}">${t.completed?'Bitti':esc(t.type||'Görev')}</span></div>`}

ype||'Görev')}${t.teacher?` · ${esc(t.teacher)}`:''}<br>${t.completed?'✓ Tamamlandı':t.duration?`${t.duration} dk`:'Görev'}${book?` · ${esc(book.name)}`:''}</small></button>`}).join(''):`<div class="small muted" style="padding:8px 2px">Bu gün için henüz görev yok.</div>`}<button class="cal-add" data-action="open-task" data-date="${dateKey}">＋ Bu güne görev ekle</button></div></div>`}).join('')}</div><div class="section-stack" style="margin-top:16px"><section class="panel"><div class="panel-head"><h2>Bu haftanın özeti</h2></div><div class="panel-body">${renderWeekSummary(dates)}</div></section></div>`}

function aiCompactContext(){
 const today=iso(new Date()),week=weekDates(0),sessions=(db.timer?.sessions||[]).filter(s=>s.date&&Number(s.ms)>0);
 const books=(db.books||[]).map(b=>{const st=bookStats(b);return {name:b.name,subject:b.subject,exam:b.exam,publisher:b.publisher||'',units:(b.units||[]).map(u=>({name:u.name,testCount:u.testCount,doneTests:u.doneTests||u.completedTests||0})),progressPct:st.pct,totalTests:st.total,completedTests:st.done,remainingTests:Math.max(0,st.total-st.done)}});
 const tasks=(db.tasks||[]).map(t=>({date:t.date,title:t.title,subject:t.subject,exam:t.exam,type:t.type,completed:!!t.completed,duration:t.duration||null,bookName:bookById(t.bookId)?.name||'',topic:t.topicName||'',teacher:t.teacher||''})).slice(-120);
 const exams=(db.exams||[]).slice(-12).map(e=>({date:e.date,name:e.name,exam:e.exam,totalNet:e.totalNet,subjects:(e.subjects||[]).map(s=>({subject:s.subject,correct:s.correct,wrong:s.wrong,blank:s.blank,net:s.net}))}));
 const study=sessions.slice(-80).map(s=>({date:s.date,subject:s.subject,minutes:Math.round(Number(s.ms)/60000),description:s.description||''}));
 const todayTasks=tasks.filter(t=>t.date===today); const weekTasks=tasks.filter(t=>week.some(d=>iso(d)===t.date));
 return {today,weekStart:iso(week[0]),weekEnd:iso(week[6]),goal:db.meta?.goal||'',targetNotes:db.meta?.targetNotes||'',books,tasks:tasks.slice(-70),exams,studyLog:study,todaySummary:{tasks:todayTasks.length,completed:todayTasks.filter(t=>t.completed).length,studyMinutes:study.filter(s=>s.date===today).reduce((n,s)=>n+s.minutes,0)},weekSummary:{tasks:weekTasks.length,completed:weekTasks.filter(t=>t.completed).length,studyMinutes:study.filter(s=>week.some(d=>iso(d)===s.date)).reduce((n,s)=>n+s.minutes,0)}};
}

async function sendAICoachMessage(message){message=String(message||'').trim();if(!message)return;if(demoMode){showToast('Yapay zekâ koçu için Supabase hesabınla giriş yapmalısın. Demo verileri API’ye gönderilmez.');return}if(!supabaseClient){showToast('Önce Supabase bulut bağlantısını kurup hesabınla giriş yap.');return}if(message.length>2000){showToast('Mesaj en fazla 2000 karakter olabilir.');return}aiAppendMessage('user',message);aiChatHistory.push({role:'user',content:message});const input=$('#aiChatInput'),btn=$('#aiSendBtn'),status=$('#aiStatus');if(input)input.value='';if(btn){btn.disabled=true;btn.textContent='Düşünüyor…'}if(status)status.textContent='Koç verilerini inceliyor…';try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;const token=data?.session?.access_token;if(!token)throw new Error('Oturumun sona ermiş. Yeniden giriş yap.');const payload={message,history:aiChatHistory.slice(-9,-1).slice(-8),context:aiCompactContext()};const res=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)});const body=await res.json().catch(()=>({}));if(!res.ok){let detail=body.error||`Koç yanıt veremedi (${res.status}).`;if(res.status===404)detail='Yapay zekâ sunucu dosyası yayımlanmamış görünüyor. api/coach.js dosyasının Vercel projesinde bulunduğunu kontrol et.';if(res.status===503&&!body.error)detail='Yapay zekâ bağlantısı için Vercel ortam değişkenleri eksik.';throw new Error(detail)}const answer=String(body.reply||'Yanıt alınamadı.');aiChatHistory.push({role:'assistant',content:answer});aiAppendMessage('assistant',answer);if(status)status.textContent='Yanıt hazır · Sohbet bu oturum boyunca bellekte tutulur.';}catch(err){aiChatHistory.pop();let detail=String(err?.message||'Bağlantıyı kontrol et.');if(err instanceof TypeError||/failed to fetch|networkerror|load failed/i.test(detail)){try{const probe=await fetch(new URL('/api/health',window.location.origin),{method:'GET',cache:'no-store',headers:{'Accept':'application/json'}});const diag=await probe.json().catch(()=>({}));if(!probe.ok){detail='Sunucu kontrolü başarısız (HTTP '+probe.status+'). Vercel projesinde api/health.js ve api/coach.js dosyalarının yayımlandığını kontrol et.';}else if(!diag.configured){const missing=(diag.missing||[]).join(', ');detail='Yapay zekâ sunucusu çalışıyor ancak Vercel ortam değişkenleri eksik: '+missing+'. Vercel → Settings → Environment Variables bölümüne ekle ve yeni deployment yap.';}else{detail='API kontrol adresi çalışıyor ama sohbet isteği sunucuya ulaşamadı. Aynı Vercel dağıtımında api/coach.js dosyasının bulunduğunu, son deployment’ın tamamlandığını ve tarayıcı ağ bağlantısını kontrol et. /api/health adresini açarak sunucu kontrolünü deneyebilirsin.';}}catch(probeErr){detail='Vercel API sunucusuna ulaşılamıyor (Failed to fetch). Büyük olasılıkla son sürüm API dosyalarıyla birlikte yayımlanmadı veya uygulama farklı bir adreste açıldı. Proje kökünde api/coach.js, api/health.js ve vercel.json bulunmalı; bu dosyalarla yeniden deploy et. Supabase verilerini silmen gerekmez.';}}aiAppendMessage('assistant','Yanıt alınamadı: '+detail);if(status)status.textContent='Bağlantı teşhisi tamamlandı. Gerekirse /api/health kontrolünü aç.';}finally{if(btn){btn.disabled=false;btn.textContent='Gönder ↗'}input?.focus()}}

<section class="panel settings-card"><h2>💾 Verilerini yedekle</h2><p>Kitapların, ünitelerin, görevlerin, rutinlerin ve konu işaretlerin bir JSON dosyasına aktarılır. Bu dosya kişisel çalışma verilerini içerir.</p><button class="secondary full" data-action="export-data">Yedek dosyası indir (.json)</button><label class="secondary full" style="display:block;text-align:center;margin-top:9px;cursor:pointer">Yedekten geri yükle<input id="importFile" type="file" accept="application/json,.json" style="display:none"></label><p class="small" style="margin-top:12px">Yedek dosyanı başkalarıyla paylaşma; içinde kişisel planın bulunabilir.</p></section>
<section class="panel settings-card"><h2>🔒 Veri güvenliği</h2><p>Bulut modunda erişim, Supabase kimlik doğrulama ve satır düzeyi güvenlik kurallarıyla korunur. Bu prototipte verileri buluta taşıma işlemi için proje kurulumu gereklidir.</p><div class="note">Şifre, Google giriş bilgisi veya Supabase servis rolü anahtarını uygulamaya ya da sohbet mesajına yazma.</div><button class="ghost full" style="margin-top:12px" data-action="logout">${demoMode?'Demo alanından çık':'Güvenli çıkış yap'}</button></section></div><div class="footer-note">Rota YKS · Kişisel YKS çalışma sistemi · Verilerini düzenli yedekle</div>`}
function setView(v){view=v;renderNav();renderView();window.scrollTo({top:0,behavior:'smooth'})}
function openModal(title,desc,body){$('#modalRoot').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>${title}</h2><p>${desc||''}</p></div><button class="modal-close" data-action="close-modal" aria-label="Kapat">×</button></div><div class="modal-body">${body}</div></section></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function subjectSelect(name='subject',value='Matematik'){return `<select name="${name}" required>${SUBJECTS.map(s=>`<option ${s===value?'selected':''}>${s}</option>`).join('')}</select>`}
function unitRowHtml(name='',count=''){return `<div class="unit-edit-row"><input name="unitName" placeholder="Ünite adı (örn. Temel Kavramlar)" value="${escAttr(name)}" required maxlength="100"><input name="unitCount" type="number" min="1" max="500" placeholder="Test sayısı" value="${escAttr(count)}" required><button type="button" class="remove-row" data-action="remove-unit-row" aria-label="Üniteyi kaldır">×</button></div>`}
function openBookModal(){openModal('Kitap ekle','Kitap bilgilerini ve içindeki ünitelerin test sayılarını gir.',`<form id="bookForm"><div class="form-grid"><div class="field span-2"><label>Kitabın tam adı *</label><input name="name" required maxlength="140" placeholder="Örn. Bilgi Sarmal TYT Matematik"></div><div class="field"><label>Branş *</label>${subjectSelect('subject')}</div><div class="field"><label>Sınav türü *</label><select name="exam" required><option>TYT</option><option>AYT</option></select></div><div class="field span-2"><label>Yayınevi / seri (isteğe bağlı)</label><input name="publisher" maxlength="100" placeholder="Örn. Bilgi Sarmal"></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 9px;gap:8px"><div><strong style="font-size:12px">Üniteler ve test adetleri</strong><div class="small muted" style="margin-top:3px">Test sayısı kitabındaki gerçek sayıya göre girilmeli.</div></div><button type="button" class="secondary" data-action="add-unit-row">＋ Ünite</button></div><div id="unitRows">${unitRowHtml()}</div><details style="margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffafd"><summary style="cursor:pointer;font-size:12px;font-weight:850;color:var(--navy)">📷 İçindekiler fotoğrafını akıllı tara</summary><p class="small muted" style="line-height:1.55">Fotoğraf önce netleştirilir ve kontrastı artırılır; OCR başlıkları satır satır çıkarır. Basılı içindekiler sayfası, iyi ışık ve düz açı en iyi sonucu verir. Otomatik okuma hatasız değildir: aktarım öncesi başlıkları kontrol et; test sayılarını ayrıca gir.</p><div class="field"><label>İçindekiler fotoğrafı</label><input id="contentsImage" type="file" accept="image/*"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="secondary" data-action="ocr-contents">Fotoğraftaki metni oku</button><button type="button" class="ghost" data-action="contents-to-units">Başlıkları ünite satırlarına aktar</button></div><div id="ocrStatus" class="small muted" style="margin:9px 0"></div><div class="field"><label>Okunan metin — kontrol et ve düzenle</label><textarea id="ocrText" rows="5" placeholder="OCR sonucu burada görünür. Başlıkları satır satır düzenleyebilirsin."></textarea></div></details><div class="modal-foot"><button type="button" class="ghost" data-action="close-modal">Vazgeç</button><button class="primary" type="submit">Kitabı kaydet</button></div></form>`)}
function openAddUnitModal(bookId){const b=bookById(bookId);if(!b)return;openModal('Ünite ekle',`${b.name} kitabına yeni ünite ve test sayısı ekle.`, `<form id="unitForm" data-book="${b.id}"><div class="field"><label>Ünite adı *</label><input name="name" required maxlength="100" placeholder="Örn. Temel Kavramlar"></div><div class="field"><label>Bu ünitedeki toplam test sayısı *</label><input name="testCount" required type="number" min="1" max="500" placeholder="Örn. 12"></div><div class="modal-foot"><button type="button" class="ghost" data-action="close-modal">Vazgeç</button><button type="submit" class="primary">Üniteyi kaydet</button></div></form>`)}
function booksForSubject(subject,exam){return db.books.filter(b=>b.subject===subject&&(!exam||b.exam===exam))}function bookOptions(subject,exam,selected=''){const list=booksForSubject(subject,exam);return `<option value="">Kitap seç…</option>`+list.map(b=>`<option value="${b.id}" ${b.id===selected?'selected':''}>${esc(b.exam)} · ${esc(b.name)}</option>`).join('')}function unitOptions(bookId,selected=''){const b=bookById(bookId);return `<option value="">Ünite / test grubu seç…</option>`+(b?.units||[]).map(u=>`<option value="${u.id}" ${u.id===selected?'selected':''}>${esc(u.name)} · ${u.testCount} test</option>`).join('')}
function openTaskModal(date=iso(new Date()),bookId='',unitId=''){const chosen=bookById(bookId);const subject=chosen?.subject||'Matematik';const exam=chosen?.exam||'TYT';openModal('Çalışma görevi oluştur','Kitaptan test çözebilir veya kitap seçmeden konu, öğretmen ve video çalışması planlayabilirsin.',`<form id="taskForm"><div class="form-grid"><div class="field"><label>Görev tarihi *</label><input name="date" type="date" required value="${date}"></div><div class="field"><label>Çalışma türü</label><select name="type"><option>Test çözümü</option><option selected>Konu çalışması</option><option>Konu tekrarı</option><option>Video / ders</option><option>Deneme</option><option>Diğer</option></select></div><div class="field"><label>Ders / branş *</label><select name="subject" id="taskSubject" required>${SUBJECTS.map(s=>`<option ${s===subject?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Sınav türü</label><select name="exam" id="taskExam"><option ${exam==='TYT'?'selected':''}>TYT</option><option ${exam==='AYT'?'selected':''}>AYT</option></select></div><div class="field span-2"><label>Konu / çalışılacak başlık</label><input name="topicName" maxlength="180" placeholder="Örn. Fonksiyonlarda bileşke — konu anlatımı"></div><div class="field"><label>Öğretmen / kanal</label><input name="teacher" maxlength="120" placeholder="Örn. Rehber Matematik"></div><div class="field"><label>Video bağlantısı (isteğe bağlı)</label><input name="videoUrl" type="url" maxlength="500" placeholder="https://..."></div><div class="field span-2"><label>Kitap (yalnızca test görevi için, isteğe bağlı)</label><select name="bookId" id="taskBook"><option value="">Kitap seçmeden devam et</option>${bookOptions(subject,exam,bookId)}</select><div class="small muted">Konu videosu veya konu çalışması için kitap seçmek zorunda değilsin.</div></div><div class="field span-2"><label>Ünite / test grubu (isteğe bağlı)</label><select name="unitId" id="taskUnit"><option value="">Kitap seçilmedi</option>${unitOptions(bookId,unitId)}</select></div><div class="field"><label>Test başlangıç numarası</label><input name="testStart" id="testStart" type="number" min="1" max="500" placeholder="Örn. 1"></div><div class="field"><label>Test bitiş numarası</label><input name="testEnd" id="testEnd" type="number" min="1" max="500" placeholder="Örn. 3"></div><div class="field span-2"><label>Görev başlığı (isteğe bağlı)</label><input name="title" maxlength="150" placeholder="Boş bırakırsan konu başlığından oluşturulur"></div><div class="field"><label>Hedef süre (dakika)</label><input name="duration" type="number" min="0" max="1440" placeholder="Örn. 60"></div><div class="field span-2"><label>Not (isteğe bağlı)</label><textarea name="notes" maxlength="600" placeholder="Sayfa numarası, videoda kalınan dakika, dikkat edilecekler…"></textarea></div></div><div id="taskBookHint" class="note" style="margin-top:8px">Kitap seçmek zorunlu değil. Konu çalışması için konu ve öğretmen alanlarını doldurman yeterli.</div><div class="modal-foot"><button type="button" class="ghost" data-action="close-modal">Vazgeç</button><button type="submit" class="primary">Görevi kaydet</button></div></form>`)}
function openTopicModal(){openModal('Konu ekle','TYT/AYT, ders ve ünite bilgilerini tanımla.',`<form id="topicForm"><div class="form-grid"><div class="field"><label>Sınav türü *</label><select name="exam"><option>TYT</option><option>AYT</option></select></div><div class="field"><label>Branş *</label>${subjectSelect('subject')}</div><div class="field span-2"><label>Konu / ünite adı *</label><input name="name" required maxlength="140" placeholder="Örn. Temel Kavramlar"></div><div class="field span-2"><label>Üst ünite veya not (isteğe bağlı)</label><input name="unit" maxlength="100" placeholder="Örn. Sayılar"></div></div><div class="modal-foot"><button type="button" class="ghost" data-action="close-modal">Vazgeç</button><button type="submit" class="primary">Konuyu kaydet</button></div></form>`)}
function openRoutineModal(){openModal('Günlük rutin ekle','Her gün tekrar edeceğin hedefi ve ölçüsünü belirle.',`<form id="routineForm"><div class="field"><label>Rutin adı *</label><input name="title" required maxlength="100" placeholder="Örn. Paragraf soruları"></div><div class="form-grid"><div class="field"><label>Hedef / adet</label><input name="target" maxlength="80" placeholder="Örn. 30 soru"></div><div class="field"><label>Ders (isteğe bağlı)</label><select name="subject"><option value="">Genel</option>${SUBJECTS.map(s=>`<option>${s}</option>`).join('')}</select></div></div><div class="modal-foot"><button type="button" class="ghost" data-action="close-modal">Vazgeç</button><button type="submit" class="primary">Rutini ekle</button></div></form>`)}
function openConfigModal(){const c=readConfig()||{};openModal('Bulut bağlantısı','Bu alan bir Supabase projesine bağlanır. Proje bilgilerini yalnız kendi kontrol ettiğin panelden al.',`<div class="note warning" style="margin-bottom:14px">Buraya yalnızca Project URL ve anon/public (publishable) key gir. <strong>service_role / secret key girme.</strong> Bu bağlantıyı kurmadan önce SQL şemasını Supabase SQL Editor bölümünde çalıştırmalısın.</div><form id="configForm"><div class="field"><label>Supabase Project URL</label><input name="url" required type="url" value="${escAttr(c.url||'')}" placeholder="https://xxxxxxxx.supabase.co"></div><div class="field"><label>Anon / publishable key</label><textarea name="key" required style="min-height:75px" placeholder="Supabase projenin public anon/publishable anahtarı">${esc(c.key||'')}</textarea></div><div class="modal-foot"><button type="button" class="ghost" data-action="close-modal">Vazgeç</button><button type="submit" class="primary">Bağlantıyı doğrula ve kaydet</button></div><div id="configResult" class="error"></div></form><div class="rule"></div><button class="tiny-link" data-action="sql-help">SQL ve kurulum rehberini göster</button>`)}
function openAccountModal(){openModal('Hesap ve oturum','Mevcut oturum bilgilerin.',`<div class="note ${demoMode?'warning':'success'}">${demoMode?'Demo çalışma alanı yalnızca bu tarayıcıda saklanır.':'Bulut hesabın aktif. Kendi hesabının verileri diğer kullanıcıların verilerinden ayrıdır.'}</div><div class="field" style="margin-top:14px"><label>Ad / e-posta</label><input readonly value="${esc(authUser?.email||'Demo Öğrencisi')}"></div><div class="modal-foot"><button class="ghost" data-action="close-modal" type="button">Kapat</button><button class="danger" data-action="logout" type="button">${demoMode?'Demo alanından çık':'Oturumu kapat'}</button></div>`)}
function showSqlHelp(){openModal('Bulut kurulum rehberi','Bu prototipin gerçek kullanıcı hesaplarıyla farklı cihazlarda çalışması için gereken kurulum.',`<ol style="font-size:12px;line-height:1.75;padding-left:20px;color:#4e5c74"><li>Supabase üzerinde yeni bir proje oluştur.</li><li>Project Settings / API bölümünden Project URL ve public anon/publishable key değerlerini al.</li><li>SQL Editor aç ve sana verilen <strong>rota-yks-schema.sql</strong> dosyasındaki SQL komutlarını çalıştır.</li><li>Authentication ayarlarında e-posta/şifre girişini aç. Google ile giriş için Google sağlayıcısını etkinleştirip OAuth bilgilerini Supabase tarafında tanımla.</li><li>Bu sayfaya dönüp Ayarlar → Bulut hesabı alanına Project URL ve public anahtarı gir.</li><li>Siteyi HTTPS destekleyen bir statik barındırıcıya yükle; uygulamanın URL'sini Supabase Auth redirect URL listesine ekle.</li></ol><div class="note warning">Yalnızca tarayıcı koduyla sunucu kurmadan güvenli çok kullanıcılı senkronizasyon mümkün olmaz. SQL'deki RLS kuralları, her kullanıcının yalnız kendi veri satırına erişmesini sağlar.</div><div class="modal-foot"><button class="ghost" data-action="close-modal">Kapat</button><button class="primary" data-action="cloud-config">Bağlantı ayarları</button></div>`)}
function openTaskEdit(t){openModal('Görev ayrıntısı',fmtDate(fromISO(t.date),{day:'numeric',month:'long',year:'numeric'}),`${renderTaskRow(t)}<div class="modal-foot"><button class="danger" data-action="delete-task" data-id="${t.id}">Görevi sil</button><button class="ghost" data-action="close-modal">Kapat</button><button class="primary" data-action="toggle-task" data-id="${t.id}">${t.completed?'Tamamlanmadı olarak işaretle':'Tamamlandı olarak işaretle'}</button></div>`)}
function persist(){if(demoMode){try{localStorage.setItem(DEMO_KEY,JSON.stringify(db));}catch(e){showToast('Yerel kayıt başarısız. Tarayıcı depolama alanını kontrol et.')}return}if(!supabaseClient||!authUser)return;clearTimeout(saveTimer);$('#syncStatus').innerHTML='<i class="sync-dot" style="background:#e6b45d"></i><span>Kaydediliyor…</span>';saveTimer=setTimeout(async()=>{try{const {error}=await supabaseClient.from('yks_user_data').upsert({user_id:authUser.id,payload:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;$('#syncStatus').innerHTML='<i class="sync-dot"></i><span>Buluta kaydedildi</span>'}catch(e){console.error(e);$('#syncStatus').innerHTML='<i class="sync-dot" style="background:#e06d63"></i><span>Senkronizasyon hatası</span>';showToast('Bulut kaydı başarısız. Ayarlar ve RLS şemasını kontrol et.')}} ,500)}
function persistAndRender(msg){persist();renderView();updateUserHeader();if(msg)showToast(msg)}
function readConfig(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch{return null}}
async function loadCloudPayload(){const {data,error}=await supabaseClient.from('yks_user_data').select('payload').eq('user_id',authUser.id).maybeSingle();if(error)throw error;db=safeData(data?.payload||emptyData());showView()}
async function onCloudAuth(user){authUser=user;demoMode=false;try{await loadCloudPayload()}catch(e){console.error(e);showToast('Veriler alınamadı. SQL şeması ve erişim kurallarını kontrol et.');showView()}}
function renderAuth(){ $('#appView').classList.add('hidden');$('#authView').classList.remove('hidden');$('#authView').innerHTML=`<section class="auth-card"><div class="brand-lockup"><div class="brand-mark">R</div><div><div class="brand-name">Rota YKS</div><div class="brand-sub">Planını kur. Çalışmanı takip et. İlerlemeni gör.</div></div></div><div style="margin:22px 0 0"><h1 style="font-size:22px;letter-spacing:-.04em;margin:0">YKS çalışma alanına giriş yap</h1><p class="muted" style="font-size:12px;line-height:1.6;margin:8px 0 0">Kitaplığın, haftalık takvimin ve görevlerin tek bir kişisel panelde.</p></div><div class="auth-tabs"><button data-action="auth-tab" data-value="login" class="${authTab==='login'?'active':''}">Giriş yap</button><button data-action="auth-tab" data-value="signup" class="${authTab==='signup'?'active':''}">Hesap oluştur</button></div><div id="authFormRoot">${renderAuthForm()}</div><div class="auth-divider">ya da</div><button class="secondary full" data-action="google-auth">◎ Google ile devam et</button><div class="auth-actions"><button class="ghost" data-action="demo-start">Demo alanını aç</button><button class="ghost" data-action="cloud-config">Bulut bağlantısı</button></div><div class="note" style="margin-top:14px">Gerçek hesaplar ve cihazlar arası eşitleme için Supabase bağlantısı gerekir. Demo alanı verilerini yalnızca bu tarayıcıda saklar.</div></section>`}
function renderAuthForm(){if(!readConfig())return `<div class="note warning">Bulut hesabı henüz bağlanmadı. İstersen demo alanıyla arayüzü deneyebilir, daha sonra güvenli hesap bağlantısını kurabilirsin.</div>`;return `<form id="authForm">${authTab==='signup'?`<div class="field"><label>Ad soyad *</label><input name="fullName" required maxlength="100" placeholder="Adın ve soyadın"></div>`:''}<div class="field"><label>E-posta adresi *</label><input name="email" type="email" required autocomplete="email" placeholder="ornek@mail.com"></div><div class="field"><label>Şifre *</label><input name="password" type="password" required minlength="8" autocomplete="${authTab==='signup'?'new-password':'current-password'}" placeholder="En az 8 karakter"></div><button type="submit" class="primary full">${authTab==='signup'?'Hesabımı oluştur':'Giriş yap'}</button><div id="authError" class="error"></div></form>`}
async function setupSupabase(){const cfg=readConfig();if(!cfg||!window.supabase?.createClient)return false;try{supabaseClient=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}catch(e){console.error(e);return false}}
async function boot(){const ok=await setupSupabase();if(ok){try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;if(data.session){await onCloudAuth(data.session.user);supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){authUser=null;demoMode=false;db=emptyData();renderAuth()} });return}}catch(e){console.error(e)}}renderAuth()}
function startDemo(){demoMode=true;authUser={full_name:'Demo Öğrencisi',email:'demo@rotayks.local'};try{db=safeData(JSON.parse(localStorage.getItem(DEMO_KEY)||'null'))}catch{db=emptyData()}showView();showToast('Demo alanı açıldı. Değişiklikler bu tarayıcıya kaydedilir.')}

function downloadFile(name,content,type='application/json'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}

document.addEventListener('input',e=>{if(['bookSearch','bookExamFilter','bookSubjectFilter'].includes(e.target.id))filterBooks();if(e.target.id==='noteSearch'){const pos=e.target.selectionStart;renderView();const n=$('#noteSearch');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch{}}}if(e.target.id==='topicSubjectSel'){topicSubjectFilter=e.target.value;renderView()}});
document.addEventListener('change',e=>{if(e.target.id==='noteImageFile'&&e.target.files?.[0]){const file=e.target.files[0];if(!file.type.startsWith('image/')){showToast('Lütfen bir görsel dosyası seç.');e.target.value='';return}if(file.size>8*1024*1024){showToast('Görsel 8 MB üzerinde. Daha küçük bir fotoğraf seç.');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1100/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.68);if(data.length>950000)data=canvas.toDataURL('image/jpeg',.48);const input=$('#noteForm [name="imageData"]');if(input)input.value=data;const preview=$('#noteImagePreview');if(preview)preview.innerHTML=`<div class="note-preview"><img src="${data}" alt="Fotoğraf önizlemesi"><span class="small">Fotoğraf eklendi ve küçültüldü.</span><button type="button" class="ghost" data-action="remove-note-image">Kaldır</button></div>`;};img.onerror=()=>showToast('Görsel okunamadı. Başka bir dosya dene.');img.src=reader.result;};reader.readAsDataURL(file);return;}});
document.addEventListener('change',e=>{if(e.target.id==='taskSubject'||e.target.id==='taskExam'){const form=$('#taskForm');if(!form)return;const subject=form.elements.subject.value,exam=form.elements.exam.value;$('#taskBook').innerHTML='<option value="">Kitap seçmeden devam et</option>'+bookOptions(subject,exam);$('#taskUnit').innerHTML='<option value="">Kitap seçilmedi</option>';$('#testStart').value='';$('#testEnd').value='';$('#taskBookHint').textContent='Kitap seçmek zorunlu değil. Konu çalışması için konu ve öğretmen alanlarını doldurabilirsin.';}if(e.target.id==='taskBook'){const b=bookById(e.target.value);$('#taskUnit').innerHTML=b?unitOptions(e.target.value):'<option value="">Kitap seçilmedi</option>';$('#testStart').max=b?Math.max(1,...b.units.map(u=>u.testCount)):500;$('#testEnd').max=b?Math.max(1,...b.units.map(u=>u.testCount)):500;$('#testStart').value='';$('#testEnd').value='';if(!b)$('#taskBookHint').textContent='Kitap seçilmedi. Konu çalışması, video veya genel görev olarak devam edebilirsin.';}if(e.target.id==='taskUnit'){const b=bookById($('#taskBook')?.value),u=unitById(b,e.target.value);$('#testStart').value='';$('#testEnd').value='';if(u){$('#testStart').max=u.testCount;$('#testEnd').max=u.testCount;$('#taskBookHint').textContent=`${u.name}: 1–${u.testCount} arası test seçebilirsin.`}}if(e.target.id==='timerSubject'&&db.timer){db.timer.subject=e.target.value;persist();const l=$('#timerSubjectLabel');if(l)l.textContent=e.target.value;}if(e.target.id==='examType'){const root=$('#examSubjectFields');if(root)root.innerHTML=examSubjectFields(e.target.value);}});
setInterval(()=>{renderYksMiniStats();if(view==='timer'&&db.timer){const display=$('#timerDisplay');if(display)display.textContent=clock(timerElapsed());const total=$('#todayTimerTotal');if(total){const saved=(db.timer.sessions||[]).filter(x=>x.date===iso(new Date())).reduce((n,x)=>n+x.ms,0);total.textContent=clock(saved+(db.timer.runningSince?timerElapsed():0));}}},1000);
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files?.[0]){const file=e.target.files[0],reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed.data||!Array.isArray(parsed.data.books)||!Array.isArray(parsed.data.tasks))throw new Error('Bu yedek dosyası Rota YKS biçiminde değil.');if(!confirm('İçe aktarma mevcut çalışma alanını yedek dosyasındaki verilerle değiştirecek. Devam edilsin mi?'))return;db=safeData(parsed.data);persistAndRender('Yedek geri yüklendi.')}catch(err){showToast(err.message||'Yedek dosyası okunamadı.')} };reader.readAsText(file)}});
window.addEventListener('error',e=>console.error('Rota YKS error',e.message));
boot();
const _cdn=document.getElementById('supabase-cdn');if(_cdn)_cdn.addEventListener('load',()=>{if(!supabaseClient&&!authUser)boot()});
})();
</script>
</body></html>
